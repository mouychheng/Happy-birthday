<!-- MEMORY WALL GALLERY SECTION -->
<style>
  .polaroid-card {
    transition: all 0.3s ease;
  }
</style>

<section class="mt-8">
  <div class="text-center mb-6">
    <!-- Title: បន្ថែម Drop Shadow និងកែសម្រួលពណ៌ឱ្យច្បាស់ទាំងយប់ទាំងថ្ងៃ -->
    <h3 class="text-xl sm:text-2xl font-moul text-sky-600 dark:text-sky-400 drop-shadow-sm">
      ʃ♡ƪ . រូបភាពចងចាំ Happy Birthday . ʃ♡ƪ 💙
    </h3>
    <!-- Subtitle: ប្តូរមកប្រើ text-slate-600 (ថ្ងៃ) និង text-slate-300 (យប់) ដើម្បីឱ្យច្បាស់ត្រជាក់ភ្នែក -->
    <p class="text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300 mt-1.5">
      ចុចលើរូបដើម្បីមើលធំ Fullscreen ឬជ្រើសរើសរូបថតផ្ទាល់ខ្លួនរបស់អ្នក
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Card 1 -->
    <div class="polaroid-card p-3 rounded-2xl transform -rotate-2 hover:rotate-0 hover:scale-105 shadow-md bg-white/90 dark:bg-slate-800/80 backdrop-blur-md border border-white/90 dark:border-slate-700">
      <div class="relative overflow-hidden rounded-xl aspect-square bg-sky-100 dark:bg-slate-700">
        <img id="gImg1" src="assets/img1.jpg" alt="Memory 1" class="w-full h-full object-cover">
      </div>
      <div class="p-2 text-center">
        <p class="text-xs font-bold text-slate-700 dark:text-slate-200">✨ "A beautiful moment"</p>
        <label class="mt-1 inline-block text-[11px] text-sky-600 dark:text-sky-400 cursor-pointer hover:underline font-semibold">
          📁 ប្ដូររូបទី១ <input type="file" class="hidden" accept="image/*" onchange="changeGalleryImg(event, 'gImg1')">
        </label>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="polaroid-card p-3 rounded-2xl transform rotate-3 hover:rotate-0 hover:scale-105 shadow-md bg-white/90 dark:bg-slate-800/80 backdrop-blur-md border border-white/90 dark:border-slate-700">
      <div class="relative overflow-hidden rounded-xl aspect-square bg-sky-100 dark:bg-slate-700">
        <img id="gImg2" src="assets/img2.jpg" onerror="this.src='assets/img1.jpg'" alt="Memory 2" class="w-full h-full object-cover">
      </div>
      <div class="p-2 text-center">
        <p class="text-xs font-bold text-slate-700 dark:text-slate-200">🌸 "Good memories"</p>
        <label class="mt-1 inline-block text-[11px] text-sky-600 dark:text-sky-400 cursor-pointer hover:underline font-semibold">
          📁 ប្ដូររូបទី២ <input type="file" class="hidden" accept="image/*" onchange="changeGalleryImg(event, 'gImg2')">
        </label>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="polaroid-card p-3 rounded-2xl transform -rotate-1 hover:rotate-0 hover:scale-105 shadow-md bg-white/90 dark:bg-slate-800/80 backdrop-blur-md border border-white/90 dark:border-slate-700">
      <div class="relative overflow-hidden rounded-xl aspect-square bg-sky-100 dark:bg-slate-700">
        <img id="gImg3" src="assets/img3.jpg" onerror="this.src='assets/img1.jpg'" alt="Memory 3" class="w-full h-full object-cover">
      </div>
      <div class="p-2 text-center">
        <p class="text-xs font-bold text-slate-700 dark:text-slate-200">💙 "One of my favorite days"</p>
        <label class="mt-1 inline-block text-[11px] text-sky-600 dark:text-sky-400 cursor-pointer hover:underline font-semibold">
          📁 ប្ដូររូបទី៣ <input type="file" class="hidden" accept="image/*" onchange="changeGalleryImg(event, 'gImg3')">
        </label>
      </div>
    </div>
  </div>
</section>

<script>
  function changeGalleryImg(event, targetId) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = e => document.getElementById(targetId).src = e.target.result;
      reader.readAsDataURL(file);
    }
  }
</script>
