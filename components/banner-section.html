<!-- BANNER HERO SECTION (components/banner-section.html) -->
<style>
  @keyframes bannerFloatSlow {

    0%,
    100% {
      transform: translateY(0px) rotate(0deg);
    }

    50% {
      transform: translateY(-12px) rotate(3deg);
    }
  }

  @keyframes bannerFloatRev {

    0%,
    100% {
      transform: translateY(0px) rotate(0deg);
    }

    50% {
      transform: translateY(-10px) rotate(-3deg);
    }
  }

  @keyframes flameFlicker {

    0%,
    100% {
      transform: scale(1) rotate(-1deg);
      opacity: 0.95;
    }

    50% {
      transform: scale(1.15, 1.2) rotate(2deg);
      opacity: 1;
    }
  }

  .animate-banner-float-1 {
    animation: bannerFloatSlow 4.5s ease-in-out infinite;
  }

  .animate-banner-float-2 {
    animation: bannerFloatRev 5s ease-in-out infinite;
  }

  .animate-banner-flame {
    animation: flameFlicker 0.6s ease-in-out infinite;
    transform-origin: bottom center;
  }
</style>

<script>
  function bannerCelebrate() {
    if (typeof confetti === 'function') {
      confetti({
        particleCount: 130,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    const mainSection = document.querySelector('main');
    if (mainSection) {
      mainSection.scrollIntoView({ behavior: 'smooth' });
    }
  }
</script>
