<!-- BANNER HERO SECTION (components/banner-section.html) -->
<style>
  @keyframes bannerFloatSlow {

    0%,
    100% {
      transform: translateY(0px) rotate(0deg);
    }

    50% {
      transform: translateY(-12px) rotate(3deg);
    }
  }

  @keyframes bannerFloatRev {

    0%,
    100% {
      transform: translateY(0px) rotate(0deg);
    }

    50% {
      transform: translateY(-10px) rotate(-3deg);
    }
  }

  @keyframes flameFlicker {

    0%,
    100% {
      transform: scale(1) rotate(-1deg);
      opacity: 0.95;
    }

    50% {
      transform: scale(1.15, 1.2) rotate(2deg);
      opacity: 1;
    }
  }

  .animate-banner-float-1 {
    animation: bannerFloatSlow 4.5s ease-in-out infinite;
  }

  .animate-banner-float-2 {
    animation: bannerFloatRev 5s ease-in-out infinite;
  }

  .animate-banner-flame {
    animation: flameFlicker 0.6s ease-in-out infinite;
    transform-origin: bottom center;
  }
</style>

<!-- 🎵 Audio Tag -->
<audio id="hbdAudio" src="assets/hbd-song.mp3" preload="auto" loop></audio>

<!-- 🎶 Floating Audio Control Widget (អណ្តែតជ្រុងខាងស្តាំ - ពណ៌ខៀវ) -->
<div class="fixed bottom-5 right-5 z-50 flex items-center gap-2">
  
  <!-- សារប្រាប់អ្នកប្រើប្រាស់ (Tooltip / Label) -->
  <span id="musicLabel" class="hidden sm:inline-block bg-white/90 dark:bg-slate-800/90 text-sky-700 dark:text-sky-300 text-xs font-extrabold px-3 py-1.5 rounded-full shadow-md backdrop-blur-md border border-sky-200 dark:border-slate-700 transition-all duration-300">
    🎵 ចុចបើកចម្រៀង!
  </span>

  <!-- ប៊ូតុងតន្ត្រីអណ្តែត (ពណ៌ខៀវស្រទន់) -->
  <button id="audioToggleBtn" onclick="toggleAudio()" class="relative flex items-center justify-center w-12 h-12 rounded-full bg-gradient-to-r from-sky-400 to-indigo-500 text-white shadow-lg shadow-sky-500/30 hover:scale-110 active:scale-95 transition-all duration-300 border-2 border-white dark:border-slate-800 group cursor-pointer">
    
    <!-- Animation រលកពន្លឺពណ៌ខៀវពេលបើកចម្រៀង -->
    <span id="audioPing" class="absolute inset-0 rounded-full bg-sky-400 opacity-75 animate-ping hidden"></span>

    <!-- Icon តន្ត្រី -->
    <span id="musicIcon" class="relative text-lg transition-transform duration-500">🎵</span>
  </button>
</div>

<style>
  /* Animation វិលសម្រាប់ Icon ពេលចាក់ចម្រៀង */
  .music-spinning {
    animation: spin 3s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>

<script>
  // កូដការពារករណី function ត្រូវលោត error
  window.toggleBannerMusic = function() {
    const audio = document.getElementById('hbdAudio');
    const icon = document.getElementById('bannerMusicIcon');
    const text = document.getElementById('bannerMusicText');
    const btn = document.getElementById('bannerMusicToggleBtn');

    if (!audio) {
      console.error("រកមិនឃើញ file ឬ Tag #hbdAudio ទេ! សូមពិនិត្យឈ្មោះ file ក្នុង assets/");
      return;
    }
  };

  window.bannerCelebrate = function() {
    const audio = document.getElementById('hbdAudio');
    if (audio && audio.paused) {
      window.toggleBannerMusic();
    }

    if (typeof confetti === 'function') {
      confetti({
        particleCount: 130,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    const mainSection = document.querySelector('main');
    if (mainSection) {
      mainSection.scrollIntoView({ behavior: 'smooth' });
    }
  };
</script>
