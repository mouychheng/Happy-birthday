<!-- QUIZ GAME SECTION -->
<section class="max-w-4xl mx-auto my-6 px-4 text-center">
  <div class="bg-white/80 backdrop-blur-md rounded-3xl p-6 sm:p-10 shadow-xl border border-white/50 relative overflow-hidden">
    
    <!-- Title Header -->
    <h2 class="text-2xl sm:text-3xl md:text-4xl font-moul text-sky-600 mb-2">
      ហ្គេមទាយចំណង់ចំណូលចិត្ត 🎮✨
    </h2>
    <p class="text-xs sm:text-sm text-slate-500 font-semibold mb-6">
      តោះមកល្បងមើលថា តើអ្នកស្គាល់ និងដឹងពីចំណង់ចំណូលចិត្តខ្ញុំកម្រិតណា? (១០ សំណួរ)
    </p>

    <!-- Quiz Card Container -->
    <div id="quizContainer" class="bg-sky-50/60 p-6 sm:p-8 rounded-2xl border-2 border-dashed border-sky-300 max-w-xl mx-auto text-left shadow-inner">
      
      <!-- Progress & Score -->
      <div class="flex justify-between items-center mb-4 text-xs sm:text-sm font-bold text-sky-700">
        <span id="quizProgress">សំណួរទី ១ / ១០</span>
        <span id="quizScoreText" class="bg-white px-3 py-1 rounded-full border border-sky-200">ពិន្ទុ៖ ០</span>
      </div>

      <!-- Question Text -->
      <h3 id="quizQuestion" class="text-base sm:text-lg font-bold text-slate-800 mb-6 leading-relaxed">
        សំណួរនឹងបង្ហាញនៅទីនេះ...
      </h3>

      <!-- Options Container -->
      <div id="quizOptions" class="space-y-3">
        <!-- ចម្លើយនឹងបង្ហាញជាប៊ូតុងនៅទីនេះ -->
      </div>

    </div>

    <!-- Results Display (លាក់ទុកជាមុន) -->
    <div id="quizResult" class="hidden bg-gradient-to-br from-pink-50 via-purple-50 to-sky-50 p-6 sm:p-8 rounded-2xl border-2 border-pink-300 max-w-xl mx-auto text-center space-y-4">
      <div class="text-5xl animate-bounce">🎉 🏆 🎉</div>
      <h3 class="text-xl sm:text-2xl font-bold text-sky-700">អបអរសាទរ! អ្នកបានឆ្លើយរួចរាល់ហើយ!</h3>
      <p id="resultScore" class="text-lg font-bold text-pink-600">អ្នកឆ្លើយត្រូវ X / ១០</p>
      <p id="resultFeedback" class="text-sm text-slate-600 font-semibold max-w-md mx-auto leading-relaxed">
        សារអបអរ...
      </p>

      <button onclick="restartQuiz()" 
        class="mt-4 bg-gradient-to-r from-sky-400 to-pink-400 hover:opacity-90 text-white font-bold py-2.5 px-6 rounded-full shadow-md transition-all active:scale-95 text-sm cursor-pointer">
        🔄 លេងម្តងទៀត (Play Again)
      </button>
    </div>

  </div>
</section>

<script>
  // បញ្ជី ១០ សំណួរ និងចម្លើយត្រឹមត្រូវ (អ្នកអាចផ្លាស់ប្តូរអត្ថបទ ឬសំណួរបានតាមចិត្ត)
  const quizData = [
    {
      question: "១. តើពណ៌ណាជាពណ៌ដែលខ្ញុំចូលចិត្តជាងគេ? 🎨",
      options: [
        { text: "ពណ៌ក្រហម 🔴", correct: false },
        { text: "ពណ៌ផ្ទៃមេឃ 🩵", correct: true },
        { text: "ពណ៌ខៀវ 💙", correct: false },
        { text: "ពណ៌ស្វាយ 💜", correct: false },
        { text: "ពណ៌ស 🤍", correct: false },
        { text: "ពណ៌ខ្មៅ 🖤", correct: false }
      ]
    },
    {
      question: "២. តើភេសជ្ជៈណាដែលខ្ញុំចូលចិត្តញ៉ាំជាងគេ? 🧋",
      options: [
        { text: "តែក្រូចឆ្មារ​ 🍸", correct: false },
        { text: "តែទឺកដោះគោ មានគុជ​ 🧋", correct: false },
        { text: "កាហ្វេទឹកដោះគោ ☕", correct: false },
        { text: "តែមេអំបៅ 🍹", correct: false },
        { text: "ដូងក្រឡុក 🥥", correct: false },
        { text: "ប័រក្រឡុក 🥑", correct: false },
        { text: "ចូលចិត្តទាំងអស់ 😜", correct: true }
      ]
    },
    {
      question: "៣. តើពេលវេលាទំនេរ ខ្ញុំចូលចិត្តធ្វើអ្វីជាងគេ? 🎧",
      options: [
        { text: "លេងទូរស័ព្ទ 📱", correct: true },
        { text: "ស្តាប់ចម្រៀង 🎧", correct: true },
        { text: "មើលរឿង 🎬 🏃", correct: false },
        { text: "រត់ប្រណាំង marathon 🏃", correct: false },
        { text: "ធ្វើការងារផ្ទះអត់សម្រាក 🧹", correct: false },
        { text: "ចូលចិត្តទាំងអស់ 😜", correct: false }
      ]
    },
    {
      question: "៤. តើរដូវកាលណាដែលខ្ញុំចូលចិត្តជាងគេ? ❄️",
      options: [
        { text: "រដូវក្តៅខ្លាំង ☀️", correct: false },
        { text: "រដូវត្រជាក់ / ធ្លាក់ខ្យល់ 🌬️", correct: true },
        { text: "រដូវភ្លៀងធ្លាក់រាល់ថ្ងៃ 🌧️", correct: false },
        { text: "ចូលចិត្តទាំងអស់ 😜", correct: false },
        { text: "មិនចូលចិត្តទេ 😌", correct: false }
      ]
    },
    {
      question: "៥. តើប្រភេទសត្វចិញ្ចឹមណាដែលខ្ញុំស្រឡាញ់ជាងគេ? 🐾",
      options: [
        { text: "ឆ្មាតូចៗ និង ឆ្មាធំៗ 🐱", correct: false },
        { text: "កូនឆ្កែ កាម៉ាប់ៗ 🐕", correct: true },
        { text: "កូនជ្រូក 🐖", correct: true },
        { text: "សត្វបក្សី 🦜", correct: false }
      ]
    },
    {
      question: "៦. តើនំចំណីណាដែលខ្ញុំចូលចិត្តញ៉ាំ? 🍿",
      options: [
        { text: "នំប័ុង 🍞🥐", correct: false },
        { text: "សាំងវិច 🥪", correct: false },
        { text: "បឺហ្គ័រ 🍔", correct: false },
        { text: "ការ៉េម 🍨🧁🍧", correct: false },
        { text: "នំខេក 🍰", correct: false },
        { text: "នំសូកូឡា 🍫", correct: false },
        { text: "ចូលចិត្តទាំងអស់ 😋", correct: true }
      ]
    },
    {
      question: "៧. តើទីកន្លែងដើរលេងបែបណាដែលខ្ញុំចង់ទៅលំហែកាយ? 🏖️",
      options: [
        { text: "កន្លែងអ៊ូអរមនុស្សច្រើន 🏙️", correct: false },
        { text: "សមុទ្រ  🌊⛰️", correct: false },
        { text: "ភ្នំបៃតងត្រជាក់ ទឹកជ្រោះ បឹង អូរ ទន្លេ", correct: true },
        { text: "នៅផ្ទះរហូតអត់ទៅណា 🏠", correct: false }
      ]
    },
    {
      question: "៨. តើទម្លាប់ពេលយប់របស់ខ្ញុំជាទូទៅបែបណា? 🌙",
      options: [
        { text: "គេងលឿនណាស់ 💤", correct: false },
        { text: "រំលងអធ្រាត្រទើបគេង 🦉", correct: true },
        { text: "អត់ដែលគេងសោះ 😳", correct: false }
      ]
    },
    {
      question: "៩. តើស្ទាយនៃការលេងខ្លួនរបស់ខ្ញុំបែបណា? 👗",
      options: [
        { text: "សាមញ្ញៗ សុភាពៗ 🌸", correct: true },
        { text: "បែបស៊ិចស៊ីខ្លាំង 💃", correct: false },
        { text: "បែបរោករ៉ាក 😣", correct: false },
        { text: "ស្ទាយបែបបុរាណ 🏛️", correct: false },
        { text: "អត់ត្រូវទាំងអស់ 😌", correct: false }
      ]
    },
    {
      question: "១០. តើអ្វីដែលធ្វើឱ្យខ្ញុំមានសេចក្តីសុខបំផុតនៅថ្ងៃខួបកំណើត? 🎂",
      options: [
        { text: "បានកាដូថ្លៃៗ 💎", correct: false },
        { text: "ទទួលបានក្តីស្រឡាញ់ និងពាក្យជូនពរល្អៗពីអ្នកទាំងអស់គ្នា 💖✨", correct: true },
        { text: "បានញ៉ាំនំខេកតែម្នាក់ឯង 🎂", correct: false },
        { text: "ចង់បានទាំងអស់ 😆", correct: false }
      ]
    }
  ];

  let currentQuestionIndex = 0;
  let score = 0;

  function loadQuestion() {
    const currentQuiz = quizData[currentQuestionIndex];
    document.getElementById('quizProgress').innerText = `សំណួរទី ${currentQuestionIndex + 1} / ${quizData.length}`;
    document.getElementById('quizQuestion').innerText = currentQuiz.question;
    
    const optionsContainer = document.getElementById('quizOptions');
    optionsContainer.innerHTML = '';

    currentQuiz.options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.className = "w-full text-left p-3.5 rounded-xl bg-white hover:bg-sky-100 border border-sky-200 transition-all duration-200 text-slate-700 font-semibold text-sm sm:text-base flex justify-between items-center shadow-sm active:scale-98 cursor-pointer";
      btn.innerText = opt.text;
      btn.onclick = () => selectAnswer(btn, opt.correct);
      optionsContainer.appendChild(btn);
    });
  }

  function selectAnswer(button, isCorrect) {
    const allButtons = document.querySelectorAll('#quizOptions button');
    allButtons.forEach(btn => btn.disabled = true);

    if (isCorrect) {
      score++;
      button.classList.remove('bg-white', 'hover:bg-sky-100', 'border-sky-200');
      button.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-800');
      button.innerHTML += ' <span>✅</span>';

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 40,
          spread: 50,
          origin: { y: 0.7 }
        });
      }
    } else {
      button.classList.remove('bg-white', 'hover:bg-sky-100', 'border-sky-200');
      button.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-800');
      button.innerHTML += ' <span>❌</span>';
    }

    document.getElementById('quizScoreText').innerText = `ពិន្ទុ៖ ${score}`;

    setTimeout(() => {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }, 1100);
  }

  function showResults() {
    document.getElementById('quizContainer').classList.add('hidden');
    const resultBox = document.getElementById('quizResult');
    resultBox.classList.remove('hidden');

    document.getElementById('resultScore').innerText = `អ្នកឆ្លើយត្រូវ ${score} / ${quizData.length} សំណួរ!`;

    const feedback = document.getElementById('resultFeedback');
    if (score === quizData.length) {
      feedback.innerText = "អស្ចារ្យណាស់! អ្នកពិតជាស្គាល់ និងដឹងចិត្តខ្ញុំច្បាស់ ១០០% ឥតខ្ចោះតែម្តង! 💖✨";
      if (typeof confetti === 'function') {
        confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 } });
      }
    } else if (score >= 7) {
      feedback.innerText = "ពូកែខ្លាំងណាស់! អ្នកស្គាល់ និងដឹងពីចំណង់ចំណូលចិត្តខ្ញុំបានច្រើនណាស់! 👏🎉";
    } else if (score >= 4) {
      feedback.innerText = "ល្អបង្គួរ! អ្នកស្គាល់ខ្ញុំបានមួយចំនួនដែរតើ! 😊✨";
    } else {
      feedback.innerText = "អត់អីទេ! លើកក្រោយចាំមកលេង និងរាប់អានស្គាល់គ្នាឱ្យបានច្រើនជាងនេះណា! 🥹💖";
    }
  }

  function restartQuiz() {
    currentQuestionIndex = 0;
    score = 0;
    document.getElementById('quizScoreText').innerText = `ពិន្ទុ៖ ០`;
    document.getElementById('quizResult').classList.add('hidden');
    document.getElementById('quizContainer').classList.remove('hidden');
    loadQuestion();
  }

  loadQuestion();
</script>
