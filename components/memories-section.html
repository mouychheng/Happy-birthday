<!-- Component Script Logic -->
<script>
  (function initMemoriesComponent() {
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type = 'sine', duration = 0.2) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.log('Audio playback prevented');
      }
    }

    function playCameraShutter() {
      playTone(800, 'square', 0.05);
      setTimeout(() => playTone(300, 'triangle', 0.08), 60);
    }

    function playCorrectChime() {
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
        setTimeout(() => playTone(f, 'sine', 0.3), i * 90);
      });
    }

    // Memories Data
    const memories = [
      {
        question: "🤔 តើអនុស្សាវរីយ៍មួយនេះកើតឡើងនៅឯណា?",
        image: "assets/img11.png",
        options: [
          { key: "A", text: "ធ្វើ 3 នាក់បងប្អូន ឆ្នាំ 2022", isCorrect: true },
          { key: "B", text: "ធ្វើម្នាក់ឋង ឆ្នាំ 2022", isCorrect: false },
          { key: "C", text: "អនុស្សាវរីយ៍នៅវិទ្យាល័យ", isCorrect: false }
        ],
        caption: "💖 3 Siblings Moment · 2022",
        story: "រូបថតដ៏មានន័យរវាងបងប្អូន 3 នាក់កាលពីឆ្នាំ 2022! ជាពេលវេលាពេញដោយស្នាមញញឹម សេចក្តីសុខ និងក្តីស្រឡាញ់ក្នុងគ្រួសារ។"
      },
      {
        question: "🤔 តើហេតុការណ៍អ្វីដែលកើតឡើងក្នុងរូបនេះ?",
        image: "assets/img12.png",
        options: [
          { key: "A", text: "ចូលរួមកម្មវិធីពិធីខួបកំណើត Surprise", isCorrect: false },
          { key: "B", text: "បង្កើត និងកាត់តរូបភាពដោយប្រើ AI", isCorrect: true },
          { key: "C", text: "ទៅថតរូបនៅ Studio ខួបកំណើត", isCorrect: false },
          { key: "D", text: "ចូលរួមរាប់ថយក្រោយឆ្លងឆ្នាំថ្មី", isCorrect: false }
        ],
        caption: "🤖 AI Generated Art",
        story: "រូបភាពដ៏ស្រស់ស្អាតដែលបានបង្កើតឡើងដោយបច្ចេកវិទ្យា AI! ស្ទីលប្លែកអារម្មណ៍ និងពោរពេញដោយគំនិតច្នៃប្រឌិត។"
      },
      {
        question: "🤔 រូបភាពមួយនេះរំលឹកដល់អ្វី?",
        image: "assets/img13.png",
        options: [
          { key: "A", text: "ថ្ងៃជួបជុំសម្ភាសន៍ការងារលើកដំបូង", isCorrect: false },
          { key: "B", text: "ថ្ងៃចូលរៀនដំបូងនៅសកលវិទ្យាល័យ", isCorrect: false },
          { key: "C", text: "មិត្តរួមសកលវិទ្យាល័យធ្វើ Surprise ខួបកំណើត", isCorrect: true },
          { key: "D", text: "ការជួបជុំរៀនក្រុមនៅបណ្ណាល័យ", isCorrect: false }
        ],
        caption: "🎉 University Friends Surprise!",
        story: "ការ Surprise ដ៏កក់ក្តៅ និងរំភើបពីសំណាក់មិត្តភក្តិនៅសកលវិទ្យាល័យ! ជាអនុស្សាវរីយ៍ដ៏ល្អបវរដែលមិនអាចបាត់បង់បាន។"
      }
    ];

    let currentIndex = 0;
    let hintLevel = 0;

    window.renderMemory = function (index) {
      const data = memories[index];
      const imgEl = document.getElementById('memoryImg');
      const captionEl = document.getElementById('polaroidCaption');
      const storyBox = document.getElementById('storyBox');
      const nextBtn = document.getElementById('nextBtn');
      const qText = document.getElementById('questionText');
      const optionsGrid = document.getElementById('optionsGrid');

      if (!imgEl || !optionsGrid) return;

      // Reset State
      imgEl.classList.remove('revealed');
      imgEl.style.filter = "blur(22px)";
      imgEl.src = data.image;
      captionEl.innerText = "???";
      storyBox.classList.add('hidden');
      nextBtn.classList.add('hidden');
      qText.innerText = data.question;
      hintLevel = 0;

      // Update Progress
      const curText = document.getElementById('memCurrentRoundText');
      if (curText) curText.innerText = `${index + 1} / ${memories.length}`;

      const dots = document.querySelectorAll('.mem-dot');
      dots.forEach((dot, idx) => {
        dot.className = "mem-dot w-2.5 h-2.5 rounded-full bg-slate-300 dark:bg-slate-700 transition-all duration-300";
        if (idx === index) dot.classList.add('active');
        if (idx < index) dot.classList.add('completed');
      });

      // Render Options
      optionsGrid.innerHTML = '';
      data.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'mem-opt-btn';
        btn.innerHTML = `<span class="mem-opt-letter">${opt.key}</span> <span>${opt.text}</span>`;
        btn.onclick = () => handleChoice(btn, opt.isCorrect, data);
        optionsGrid.appendChild(btn);
      });
    };

    window.toggleHint = function () {
      const imgEl = document.getElementById('memoryImg');
      if (!imgEl || imgEl.classList.contains('revealed')) return;
      hintLevel = (hintLevel + 1) % 3;
      const blurs = ["22px", "12px", "6px"];
      imgEl.style.filter = `blur(${blurs[hintLevel]})`;
      playTone(400 + hintLevel * 100, 'sine', 0.15);
    };

    function handleChoice(selectedBtn, isCorrect, data) {
      const allButtons = document.querySelectorAll('.mem-opt-btn');
      allButtons.forEach(b => b.disabled = true);

      if (isCorrect) {
        selectedBtn.classList.add('correct');
        revealMemory(data);
        playCorrectChime();
        if (typeof confetti === 'function') {
          confetti({ particleCount: 75, spread: 60, origin: { y: 0.6 } });
        }
      } else {
        selectedBtn.classList.add('wrong');
        playTone(200, 'sawtooth', 0.3);
        allButtons.forEach(btn => {
          if (btn.innerText.includes(data.options.find(o => o.isCorrect).text)) {
            btn.classList.add('correct');
          }
        });
        setTimeout(() => revealMemory(data), 600);
      }
    }

    function revealMemory(data) {
      playCameraShutter();
      const flash = document.getElementById('flashOverlay');
      if (flash) {
        flash.classList.add('flashing');
        setTimeout(() => flash.classList.remove('flashing'), 600);
      }

      const imgEl = document.getElementById('memoryImg');
      if (imgEl) {
        imgEl.classList.add('revealed');
        imgEl.style.filter = "blur(0px)";
      }

      document.getElementById('polaroidCaption').innerText = data.caption;

      const storyBox = document.getElementById('storyBox');
      document.getElementById('storyTitle').innerText = `✨ ${data.caption}`;
      document.getElementById('storyDesc').innerText = data.story;
      storyBox.classList.remove('hidden');

      const nextBtn = document.getElementById('nextBtn');
      if (currentIndex < memories.length - 1) {
        nextBtn.innerText = "អនុស្សាវរីយ៍បន្ទាប់ ➔";
        nextBtn.classList.remove('hidden');
      } else {
        nextBtn.innerText = "🎉 បានដោះស្រាយអនុស្សាវរីយ៍ទាំងអស់ហើយ!";
        nextBtn.classList.remove('hidden');
      }
    }

    window.nextMemory = function () {
      if (currentIndex < memories.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      renderMemory(currentIndex);
    };

    // Initial Load
    setTimeout(() => {
      renderMemory(0);
    }, 100);
  })();
</script>
