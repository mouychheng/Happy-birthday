<!-- HERO & CAKE SECTION -->
<style>
  @keyframes floatSlow {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #fef08a); }
    50% { opacity: 0.7; filter: drop-shadow(0 0 3px #f97316); }
  }
  .animate-float { animation: floatSlow 4s ease-in-out infinite; }
  .animate-flicker { animation: flicker 1.2s infinite ease-in-out; }
</style>

<section class="pt-8 text-center relative">
  <!-- Music Player Button -->
  <div class="fixed top-4 left-4 z-50">
    <button id="musicBtn" onclick="toggleAudioHero()" class="bg-white/80 backdrop-blur-md px-4 py-2 rounded-full flex items-center space-x-2 text-sky-700 shadow-md border border-white hover:scale-105 transition-all">
      <span class="text-xl">🎵</span>
      <span id="musicText" class="font-semibold text-xs md:text-sm">ចាក់ចម្រៀង Happy Birthday</span>
    </button>
  </div>

  <!-- Cake Animation -->
  <div class="relative w-60 h-60 mx-auto flex flex-col items-center justify-end animate-float my-4">
    <div id="heroCandle" onclick="blowHeroCandle()" class="cursor-pointer z-30 group" title="ចុចផ្លុំទៀន">
      <div id="heroFlame" class="w-4 h-6 bg-amber-400 rounded-full mx-auto animate-flicker"></div>
      <div class="w-2.5 h-8 bg-gradient-to-b from-pink-300 to-purple-300 rounded-sm mx-auto shadow-sm"></div>
    </div>
    <div class="w-32 h-10 bg-pink-200 rounded-t-2xl border-b-4 border-pink-300 relative z-20"></div>
    <div class="w-44 h-12 bg-sky-200 border-b-4 border-sky-300 relative z-10 flex justify-around items-center px-4">
      <span class="text-xs">🍓</span><span class="text-xs">🫐</span><span class="text-xs">🍓</span>
    </div>
    <div class="w-56 h-14 bg-amber-100 rounded-b-xl border-b-4 border-amber-200 shadow-md flex items-center justify-center">
      <span class="text-xs font-bold text-amber-700/60 font-fredoka tracking-widest">HAPPY BIRTHDAY</span>
    </div>
  </div>
  <p class="text-[11px] text-sky-600 font-semibold mb-6">💡 គន្លឹះ៖ ចុចលើទៀននៅលើនំខេក ដើម្បីផ្លុំពន្លត់ និងបាញ់កាំជ្រួច!</p>

  <!-- Titles -->
  <div class="space-y-2">
    <span class="px-4 py-1 bg-white/70 backdrop-blur-md rounded-full text-xs font-bold text-sky-600 border border-sky-200 shadow-sm inline-block">
      ✨ ថ្ងៃពិសេសអបអរខួបកំណើតខ្លួនឯង
    </span>
    <h1 class="text-3xl md:text-5xl font-moul text-sky-600 drop-shadow-sm leading-relaxed">រីករាយថ្ងៃខួបកំណើត!</h1>
    <h2 class="text-lg md:text-xl font-fredoka font-bold text-pink-500">HAPPY BIRTHDAY TO ME! 🎂💙</h2>
    <p class="text-slate-600 font-medium text-sm italic">"Another beautiful year of my life begins..."</p>
    
    <div class="flex justify-center gap-3 pt-3">
      <span class="bg-white/80 px-4 py-1.5 rounded-full text-xs font-bold text-sky-700 shadow-sm border border-sky-100">👤 សុត ម៉ួយឆេង (Sot Mouychheng)</span>
      <span class="bg-white/80 px-4 py-1.5 rounded-full text-xs font-bold text-sky-700 shadow-sm border border-sky-100">🗓️ ១២ តុលា ២០០៥</span>
    </div>
  </div>
</section>

<script>
  let isHeroCandleLit = true;
  function blowHeroCandle() {
    const flame = document.getElementById('heroFlame');
    if (isHeroCandleLit) {
      flame.style.opacity = '0';
      isHeroCandleLit = false;
      confetti({ particleCount: 70, spread: 60, origin: { y: 0.4 } });
    } else {
      flame.style.opacity = '1';
      isHeroCandleLit = true;
    }
  }

  function toggleAudioHero() {
    alert("🎵 Music player initialized!");
  }
</script>
