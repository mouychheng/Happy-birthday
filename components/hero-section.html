<!-- HERO & CAKE SECTION WITH WORKING CANDLE BLOWOUT -->
<style>
  @keyframes floatSlow {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 10px #fef08a); }
    50% { opacity: 0.7; transform: scale(0.9); filter: drop-shadow(0 0 4px #f97316); }
  }
  .animate-float { animation: floatSlow 4s ease-in-out infinite; }
  .animate-flicker { animation: flicker 1s infinite ease-in-out; }

  /* Smoke animation */
  .smoke-particle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(180, 180, 180, 0.8);
    border-radius: 50%;
    animation: popSmoke 1.2s ease-out forwards;
    pointer-events: none;
  }
  @keyframes popSmoke {
    0% { opacity: 0.8; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(3.5); }
  }
</style>

<section class="pt-8 text-center relative select-none">
  <!-- Cake Animation Container -->
  <div class="relative w-64 h-64 mx-auto flex flex-col items-center justify-end animate-float my-4">
    
    <!-- CANDLE & FLAME -->
    <div id="heroCandle" onclick="window.blowHeroCandle(event)" class="cursor-pointer z-30 group relative p-2" title="ចុចលើអណ្តាតភ្លើងដើម្បីផ្លុំពន្លត់!">
      
      <!-- Tooltip -->
      <div id="candleTooltip" class="absolute -top-10 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-[11px] font-bold text-sky-600 shadow-md transition-all border border-sky-100 whitespace-nowrap">
        🕯️ ចុចផ្លុំទៀនទីនេះ!
      </div>

      <!-- FLAME -->
      <div id="heroFlame" class="w-5 h-7 bg-amber-400 rounded-full mx-auto animate-flicker relative transition-all duration-300">
        <div class="w-2 h-3 bg-white rounded-full mx-auto pt-1"></div>
      </div>

      <!-- Smoke Container -->
      <div id="smokeContainer" class="absolute -top-2 left-1/2 -translate-x-1/2 pointer-events-none"></div>

      <!-- Candle Body -->
      <div class="w-3 h-10 bg-gradient-to-b from-pink-300 via-sky-300 to-purple-300 rounded-sm mx-auto shadow-sm"></div>
    </div>

    <!-- CAKE LAYERS -->
    <div class="w-36 h-12 bg-pink-200 rounded-t-2xl border-b-4 border-pink-300 relative z-20 flex justify-around items-start pt-1">
      <div class="w-4 h-4 bg-white/80 rounded-full -mt-2"></div>
      <div class="w-4 h-4 bg-white/80 rounded-full -mt-2"></div>
      <div class="w-4 h-4 bg-white/80 rounded-full -mt-2"></div>
    </div>
    <div class="w-48 h-14 bg-sky-200 border-b-4 border-sky-300 relative z-10 flex justify-around items-center px-4">
      <span class="text-xs">🍓</span><span class="text-xs">🫐</span><span class="text-xs">🍓</span><span class="text-xs">🫐</span>
    </div>
    <div class="w-60 h-16 bg-amber-100 rounded-b-xl border-b-4 border-amber-200 shadow-md flex items-center justify-center">
      <span class="text-xs font-bold text-amber-700/60 font-fredoka tracking-widest">HAPPY BIRTHDAY</span>
    </div>
  </div>

  <p class="text-xs text-sky-600 font-semibold mb-4 animate-pulse">
    💡 គន្លឹះ៖ ចុចលើអណ្តាតភ្លើងដើម្បីផ្លុំពន្លត់ និងបាញ់កាំជ្រួច!
  </p>

  <!-- 🌸 ប៊ូតុង Icon Cute សម្រាប់អូសទៅកន្លែងសរសេរពាក្យជូនពរ 🌸 -->
  <div class="flex justify-center mb-6">
    <button onclick="scrollToWishSection()" 
      class="bg-gradient-to-r from-pink-300 via-rose-300 to-sky-300 hover:scale-105 active:scale-95 text-pink-900 font-bold px-4 py-2 rounded-full shadow-md hover:shadow-lg transition-all text-xs sm:text-sm border border-white/60 flex items-center gap-1.5 animate-bounce cursor-pointer">
      <span>✍️</span>
      <span>ផ្ញើពាក្យជូនពរ 💌</span>
    </button>
  </div>
</section>

<script>
  window.isCandleOn = true;

  window.blowHeroCandle = function(event) {
    const flame = document.getElementById('heroFlame');
    const tooltip = document.getElementById('candleTooltip');
    const smokeContainer = document.getElementById('smokeContainer');

    if (window.isCandleOn) {
      // 1. រលត់ភ្លើងទៀន
      if (flame) {
        flame.style.display = 'none';
      }
      if (tooltip) {
        tooltip.textContent = '✨ ផ្សងប្រាថ្នារួចរាល់! (ចុចដើម្បីអុជឡើងវិញ)';
      }
      window.isCandleOn = false;

      // 2. បង្កើតផ្សែងហុយឡើងលើ
      if (smokeContainer) {
        for (let i = 0; i < 6; i++) {
          setTimeout(() => {
            const smoke = document.createElement('div');
            smoke.className = 'smoke-particle';
            smokeContainer.appendChild(smoke);
            setTimeout(() => smoke.remove(), 1200);
          }, i * 100);
        }
      }

      // 3. បាញ់កាំជ្រួច Confetti
      if (typeof confetti === 'function') {
        const rect = event ? event.currentTarget.getBoundingClientRect() : { left: window.innerWidth/2, top: 200, width: 0, height: 0 };
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;

        confetti({
          particleCount: 90,
          spread: 70,
          origin: { x: x, y: y },
          colors: ['#f472b6', '#38bdf8', '#fbbf24', '#c084fc', '#34d399']
        });
      }

    } else {
      // ចុចម្ដងទៀតដើម្បីអុជភ្លើងឡើងវិញ
      if (flame) {
        flame.style.display = 'block';
      }
      if (tooltip) {
        tooltip.textContent = '🕯️ ចុចផ្លុំទៀនទីនេះ!';
      }
      window.isCandleOn = true;
    }
  };

  // Function អូសទៅប្រអប់សរសេរពាក្យជូនពរ
  function scrollToWishSection() {
    const wishSection = document.getElementById('wish-section');
    if (wishSection) {
      wishSection.scrollIntoView({ behavior: 'smooth' });
    } else {
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
  }
</script>
